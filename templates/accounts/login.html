{% extends 'base.html' %}

{% block content %}
<section class="section" style="min-height: 70vh; display:flex; align-items:center;">
    <div class="container" style="max-width:400px;">
        <div style="background:#fff; padding: 3rem; border-radius: 15px; box-shadow: var(--shadow-lg);">
            <h2 style="text-align:center; margin-bottom: 2rem;">Secure Access</h2>
            <form method="POST">
                {% csrf_token %}
                {% if form.errors %}
                    <p style="color:#ef4444; font-size:0.9rem; text-align:center; margin-bottom:1rem;">Invalid credentials. Retry carefully.</p>
                {% endif %}
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="form-group" style="margin-bottom: 2rem;">
                    <label>Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%; border:none;">Log In</button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
